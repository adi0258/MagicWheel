<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגה ההרפתקאות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;
    }

    body {
      font-family: 'Varela Round', 'Arial Rounded MT Bold', Arial, sans-serif;
      user-select: none;
    }

    /* ─── Game Container ────────────────────────────────────────── */
    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d0d1a;
    }

    /* ─── Background Layer ──────────────────────────────────────── */
    #bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transform-origin: center center;
      transition: background 0.6s ease, transform 1.5s cubic-bezier(0.25,0.46,0.45,0.94);
      z-index: 0;
    }
    /* Straight (lanes 1-2) */
    #game.driving       #bg { transform: scale(1.6); }
    /* Turn left (lane 0) — background rushes right as camera swings left */
    #game.driving.turn-left  #bg { transform: translateX(14%) scale(1.6) rotate(4deg); }
    /* Turn right (lane 3) — background rushes left */
    #game.driving.turn-right #bg { transform: translateX(-14%) scale(1.6) rotate(-4deg); }

    /* ─── Lanes Container ───────────────────────────────────────── */
    #lanes {
      transform-origin: bottom center;
      transition: transform 1.5s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    #game.driving.turn-left  #lanes { transform: rotate(4deg); }
    #game.driving.turn-right #lanes { transform: rotate(-4deg); }

    #lanes {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: row; /* left = lane 0, right = lane 3 */
      z-index: 1;
    }

    /* In menu mode, push flex content above the dashboard */
    #lanes.menu-mode .lane {
      padding-bottom: 12vh;
    }

    /* ─── Individual Lane ───────────────────────────────────────── */
    .lane {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }

    /* Active lane: golden glow border */
    .lane::after {
      content: '';
      position: absolute;
      inset: 4px;
      border: 3px solid transparent;
      border-radius: 16px;
      pointer-events: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .lane.active::after {
      border-color: rgba(255, 220, 40, 0.85);
      box-shadow:
        inset 0 0 40px rgba(255, 220, 40, 0.12),
        0 0 24px rgba(255, 220, 40, 0.35);
      animation: lanePulse 2s ease-in-out infinite;
    }

    @keyframes lanePulse {
      0%, 100% { opacity: 0.75; }
      50%       { opacity: 1; }
    }

    /* ─── Car Dashboard Overlay ─────────────────────────────────── */
    #dashboard {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 11vh;
      overflow: visible;
      z-index: 15;
      pointer-events: none;
    }

    #dashboard img {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: auto;
      transition: transform 0.4s ease;
    }
    #game.driving            #dashboard img { transform: translateX(-50%) translateY(14px) scale(1.06); transition: transform 1.5s cubic-bezier(0.25,0.46,0.45,0.94); }
    /* Dashboard tilts into the turn (centrifugal force pushes wheel outward) */
    #game.driving.turn-left  #dashboard img { transform: translateX(-50%) translateY(14px) scale(1.06) rotate(-5deg); }
    #game.driving.turn-right #dashboard img { transform: translateX(-50%) translateY(14px) scale(1.06) rotate(5deg); }

    /* ─── Lane Content Wrapper ──────────────────────────────────── */
    .lane-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* ─── Menu: World Card ──────────────────────────────────────── */
    .world-card {
      width: 82%;
      aspect-ratio: 3/4;
      max-height: 68vh;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .lane.active .world-card {
      transform: translateY(-6px) scale(1.04);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 220, 40, 0.25);
    }

    .world-card .card-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
    }

    .world-card .card-emoji {
      position: relative;
      z-index: 1;
      font-size: clamp(4rem, 8vw, 8rem);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
      margin-bottom: 12px;
      line-height: 1;
    }

    .world-card .card-name {
      position: relative;
      z-index: 1;
      font-size: clamp(1.8rem, 3.5vw, 3.2rem);
      color: #fff;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
      font-weight: bold;
      letter-spacing: 1px;
    }

    /* Card overlay gradient so text is always readable */
    .world-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.55) 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Category: Item Image ──────────────────────────────────── */
    .item-img {
      position: absolute;
      bottom: calc(14vh + 150px);
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      max-height: 35vh;
      object-fit: contain;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45));
      transition: transform 0.3s ease, filter 0.3s ease;
      z-index: 2;
      pointer-events: none;
    }

    .lane.active .item-img {
      transform: translateX(-50%) scale(1.12);
      filter:
        drop-shadow(0 6px 14px rgba(0,0,0,0.45))
        drop-shadow(0 0 22px rgba(255, 220, 40, 0.6));
    }

    /* ─── Category: Lane Dimmer (spotlight effect) ──────────────── */
    .lane-dimmer {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.52);
      transition: background 0.3s ease;
      border-radius: 12px;
      pointer-events: none;
    }

    .lane.active .lane-dimmer {
      background: rgba(0, 0, 0, 0);
    }

    /* ─── Category: Word Label on active lane ───────────────────── */
    .lane-word {
      position: absolute;
      bottom: calc(12vh + 150px);
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.4rem, 2.8vw, 2.4rem);
      color: #fff;
      font-weight: bold;
      text-shadow: 1px 1px 8px rgba(0, 0, 0, 1), 0 0 16px rgba(0,0,0,0.8);
      background: rgba(0, 0, 0, 0.55);
      padding: 7px 22px;
      border-radius: 30px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    .lane.active .lane-word {
      opacity: 1;
    }

    /* ─── Back Arrow hint (State 2, lane 0 only) ────────────────── */
    .back-hint {
      position: absolute;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.55);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .back-hint span { font-size: 0.7rem; letter-spacing: 0.05em; }

    /* ─── Menu Header ───────────────────────────────────────────── */
    #menu-title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      text-align: center;
      padding: 18px 0 12px;
      font-size: clamp(1.4rem, 3vw, 2.5rem);
      color: #fff;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
      letter-spacing: 2px;
    }

    /* ─── Interaction Overlay ───────────────────────────────────── */
    #interaction-overlay {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }

    #interaction-overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    #interaction-item-preview {
      font-size: clamp(8rem, 22vw, 20rem);
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
      animation: itemBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      line-height: 1;
    }

    #interaction-item-img {
      max-width: 35vw;
      max-height: 38vh;
      object-fit: contain;
      filter: drop-shadow(0 6px 20px rgba(0,0,0,0.5));
      animation: itemBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes itemBounce {
      0%   { transform: scale(0.4); opacity: 0; }
      100% { transform: scale(1);   opacity: 1; }
    }

    #word-display {
      margin-top: 0;
      font-size: clamp(5rem, 18vw, 14rem);
      color: #FFE220;
      text-shadow:
        3px 3px 0 #b87900,
        0 0 50px rgba(255, 226, 32, 0.7);
      animation: wordPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.15s both;
      letter-spacing: 4px;
    }

    @keyframes wordPop {
      0%   { transform: scale(0.2) rotate(-8deg); opacity: 0; }
      80%  { transform: scale(1.08) rotate(1deg); }
      100% { transform: scale(1)    rotate(0deg); opacity: 1; }
    }

    /* ─── Nav hint ──────────────────────────────────────────────── */
    #nav-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: clamp(0.65rem, 1.2vw, 0.9rem);
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      letter-spacing: 0.05em;
    }
    /* ─── Drive-Forward Animation ───────────────────────────────── */
    #game.driving .lane.active .item-img {
      transform: translateX(-50%) scale(3.2) translateY(-8%);
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.45))
              drop-shadow(0 0 40px rgba(255,220,40,0.9));
      transition: transform 1.5s cubic-bezier(0.25,0.46,0.45,0.94), filter 1.5s ease;
    }

    #game.driving .lane:not(.active) .item-img {
      transform: translateX(-50%) scale(0.05);
      opacity: 0;
      transition: transform 1.5s cubic-bezier(0.25,0.46,0.45,0.94), opacity 0.6s ease;
    }
    #game:not(.driving) .lane:not(.active) .item-img {
      transition: transform 0.3s ease, filter 0.3s ease, opacity 0.1s ease;
    }

    #game.driving .lane:not(.active) .lane-word {
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    /* All lane dimmers fade out when driving starts, stay out through overlay */
    #game.driving .lane-dimmer,
    #game.cleared .lane-dimmer {
      background: rgba(0,0,0,0) !important;
      transition: background 0.6s ease;
    }

    /* ─── Motion Flash Overlay ──────────────────────────────────── */
    #drive-flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 70%);
      z-index: 49;
      opacity: 0;
      pointer-events: none;
    }
    @keyframes driveFlash {
      0%   { opacity: 0; }
      30%  { opacity: 0.9; }
      75%  { opacity: 0.5; }
      100% { opacity: 0; }
    }
    #game.driving #drive-flash { animation: driveFlash 1.5s ease forwards; }
  </style>
</head>
<body>
<div id="game">
  <div id="bg"></div>

  <!-- Menu title (shown only in MENU state) -->
  <div id="menu-title">🚗 &nbsp; בחר עולם &nbsp; 🚗</div>

  <!-- 4 Lanes -->
  <div id="lanes">
    <div class="lane" id="lane-0"><div class="lane-inner" id="lane-inner-0"></div></div>
    <div class="lane" id="lane-1"><div class="lane-inner" id="lane-inner-1"></div></div>
    <div class="lane" id="lane-2"><div class="lane-inner" id="lane-inner-2"></div></div>
    <div class="lane" id="lane-3"><div class="lane-inner" id="lane-inner-3"></div></div>
  </div>

  <!-- Car dashboard (always visible) -->
  <div id="dashboard"><img src="res/car inside look.png" alt=""></div>

  <!-- Drive-forward flash (State 3 transition) -->
  <div id="drive-flash"></div>

  <!-- Interaction overlay (State 3) -->
  <div id="interaction-overlay">
    <div id="word-display"></div>
  </div>

  <!-- Keyboard hint at the bottom -->
  <div id="nav-hint">← → לניווט &nbsp;|&nbsp; Enter לבחירה &nbsp;|&nbsp; ← מהשורה הראשונה לחזרה לתפריט</div>
</div>

<script>
/* ================================================================
   GAME DATA CONFIGURATION
   ─────────────────────────────────────────────────────────────────
   To swap in your own images, fill in the string paths below.

   Background images:
     menuBackground          – shown behind the 4 world cards
     worlds[n].categoryBackground – full-screen scene for that world

   Item images:
     worlds[n].items[m].image – transparent PNG of the object
                                 Leave as '' to use the emoji fallback.

   Menu card images:
     worlds[n].menuImage – illustration for the card face.
                            Leave as '' to use the emoji + gradient fallback.
================================================================ */
const CONFIG = {

  /* Background during main menu (leave '' for the built-in night-sky gradient) */
  menuBackground: '',

  worlds: [
    /* ── 0: Home ──────────────────────────────────────────────── */
    {
      id: 'home',
      name: 'בית',

      menuImage: 'res/home/home.png',
      menuGradient: 'linear-gradient(145deg, #f7971e 0%, #ffd200 50%, #d0021b 100%)',
      menuEmoji: '🏠',

      categoryBackground: 'res/home/home.png',

      items: [
        { id: 'bed',       name: 'מיטה',  image: 'res/home/bed.png'       },
        { id: 'computer',  name: 'מחשב',  image: 'res/home/computer.png'  },
        { id: 'sofa',      name: 'ספה',   image: 'res/home/sofa.png'      },
        { id: 'bookshelf', name: 'מדף',   image: 'res/home/bookshelf.png' },
      ],
    },

    /* ── 1: Street ────────────────────────────────────────────── */
    {
      id: 'street',
      name: 'רחוב',

      menuImage: 'res/street/street.png',
      menuGradient: 'linear-gradient(145deg, #4a90e2 0%, #74b9ff 50%, #2d3436 100%)',
      menuEmoji: '🏙️',

      categoryBackground: 'res/street/street.png',

      items: [
        { id: 'bench',        name: 'ספסל',     image: 'res/street/bench.png'       },
        { id: 'trafficlight', name: 'רמזור',    image: 'res/street/trafficlight.png'},
        { id: 'school',       name: 'בית ספר',  image: 'res/street/school.png'      },
        { id: 'shop',         name: 'חנות',     image: 'res/street/shop.png'        },
      ],
    },

    /* ── 2: Beach ─────────────────────────────────────────────── */
    {
      id: 'beach',
      name: 'חוף הים',

      menuImage: 'res/beach/beach.png',
      menuGradient: 'linear-gradient(145deg, #00cec9 0%, #74b9ff 40%, #fdcb6e 100%)',
      menuEmoji: '🏖️',

      categoryBackground: 'res/beach/beach.png',

      items: [
        { id: 'ball',     name: 'כדור',       image: 'res/beach/ball.png'     },
        { id: 'seashell', name: 'צדף',        image: 'res/beach/seashell.png' },
        { id: 'lifering', name: 'גלגל ים', image: 'res/beach/lifering.png' },
        { id: 'icecream', name: 'גלידה',      image: 'res/beach/icecream.png' },
      ],
    },

    /* ── 3: Forest ────────────────────────────────────────────── */
    {
      id: 'forest',
      name: 'יער',

      menuImage: 'res/forest/forest.png',
      menuGradient: 'linear-gradient(145deg, #134e5e 0%, #71b280 60%, #27ae60 100%)',
      menuEmoji: '🌲',

      categoryBackground: 'res/forest/forest.png',

      items: [
        { id: 'mushroom', name: 'פטרייה', image: 'res/forest/mushroom.png' },
        { id: 'bear',     name: 'דוב',    image: 'res/forest/bear.png'     },
        { id: 'tent',     name: 'אוהל',   image: 'res/forest/tent.png'     },
        { id: 'bonfire',  name: 'מדורה',  image: 'res/forest/bonfire.png'  },
      ],
    },
  ],
};

/* ================================================================
   STATE MACHINE
================================================================ */
const STATE = { MENU: 'MENU', CATEGORY: 'CATEGORY', INTERACTION: 'INTERACTION' };

let state        = STATE.MENU;
let activeLane   = 0;
let activeWorld  = null;
let inputLocked  = false;

/* ── DOM refs ─────────────────────────────────────────────────── */
const bgEl              = document.getElementById('bg');
const menuTitleEl       = document.getElementById('menu-title');
const navHintEl         = document.getElementById('nav-hint');
const overlayEl     = document.getElementById('interaction-overlay');

const laneEls = [0, 1, 2, 3].map(i => document.getElementById(`lane-${i}`));
const innerEls = [0, 1, 2, 3].map(i => document.getElementById(`lane-inner-${i}`));

/* ================================================================
   BACKGROUND HELPER
================================================================ */
function applyBackground(world) {
  if (!world) {
    bgEl.style.background = CONFIG.menuBackground
      ? `url('${CONFIG.menuBackground}') center / cover no-repeat`
      : 'linear-gradient(180deg, #0d0d1a 0%, #1a1a3e 40%, #0f3460 100%)';
  } else {
    bgEl.style.background = `url('${world.categoryBackground}') center / cover no-repeat`;
  }
}

/* ================================================================
   LANE HIGHLIGHT
================================================================ */
function refreshLaneHighlight() {
  laneEls.forEach((el, i) => el.classList.toggle('active', i === activeLane));
}

/* ================================================================
   RENDER: STATE 1 – MAIN MENU
================================================================ */
function renderMenu() {
  menuTitleEl.style.display = 'block';
  document.getElementById('lanes').classList.add('menu-mode');
  applyBackground(null);

  CONFIG.worlds.forEach((world, i) => {
    let faceHTML;
    if (world.menuImage) {
      faceHTML = `<div class="card-img" style="background-image:url('${world.menuImage}')"></div>`;
    } else {
      faceHTML = `<div class="card-emoji">${world.menuEmoji}</div>`;
    }

    innerEls[i].innerHTML = `
      <div class="world-card" style="background: ${world.menuGradient};">
        ${faceHTML}
        <div class="card-name">${world.name}</div>
      </div>
    `;
  });

  refreshLaneHighlight();
}

/* ================================================================
   RENDER: STATE 2 – CATEGORY VIEW
================================================================ */
function renderCategory(world) {
  menuTitleEl.style.display = 'none';
  document.getElementById('lanes').classList.remove('menu-mode');
  applyBackground(world);

  world.items.forEach((item, i) => {
    const backHint = (i === 0)
      ? `<div class="back-hint" style="display:flex;">← <span>תפריט</span></div>`
      : '';

    innerEls[i].innerHTML = `
      ${backHint}
      <div class="lane-dimmer"></div>
      <img class="item-img" src="${item.image}" alt="${item.name}">
      <div class="lane-word">${item.name}</div>
    `;
  });

  refreshLaneHighlight();
}

/* ================================================================
   RENDER: STATE 3 – INTERACTION
================================================================ */
function showInteraction(item) {
  const el = document.getElementById('word-display');
  el.style.animation = 'none';
  el.offsetHeight; /* force reflow so the animation restarts */
  el.textContent = item.name;
  el.style.animation = '';
  overlayEl.classList.add('visible');
}

function hideInteraction() {
  overlayEl.classList.remove('visible');
}

/* ================================================================
   TEXT-TO-SPEECH
================================================================ */
function speak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang    = 'he-IL';
  utter.rate    = 0.82;
  utter.pitch   = 1.15;
  utter.volume  = 1;
  speechSynthesis.speak(utter);
}

/* ================================================================
   INPUT
================================================================ */
document.addEventListener('keydown', e => {
  if (inputLocked) return;

  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      handleLeft();
      break;
    case 'ArrowRight':
      e.preventDefault();
      handleRight();
      break;
    case 'Enter':
      e.preventDefault();
      handleEnter();
      break;
  }
});

function handleLeft() {
  if (activeLane > 0) {
    activeLane--;
    refreshLaneHighlight();
  } else if (state === STATE.CATEGORY) {
    /* Leftmost lane + left arrow = back to menu */
    goToMenu();
  }
}

function handleRight() {
  if (activeLane < 3) {
    activeLane++;
    refreshLaneHighlight();
  }
}

function handleEnter() {
  if (state === STATE.MENU) {
    activeWorld = CONFIG.worlds[activeLane];
    state = STATE.CATEGORY;
    activeLane = 0;
    renderCategory(activeWorld);

  } else if (state === STATE.CATEGORY) {
    const item = activeWorld.items[activeLane];
    state = STATE.INTERACTION;
    inputLocked = true;

    const gameEl = document.getElementById('game');
    gameEl.classList.add('driving');
    if (activeLane === 0) gameEl.classList.add('turn-left');
    else if (activeLane === 3) gameEl.classList.add('turn-right');

    setTimeout(() => {
      gameEl.classList.remove('driving', 'turn-left', 'turn-right');
      showInteraction(item);
      speak(item.name);

      setTimeout(() => {
        hideInteraction();
        inputLocked = false;
        state = STATE.CATEGORY;
        refreshLaneHighlight();
      }, 3000);
    }, 1500);
  }
}

function goToMenu() {
  activeWorld = null;
  state = STATE.MENU;
  activeLane = 0;
  renderMenu();
}

/* ================================================================
   BOOT
================================================================ */
(function init() {
  renderMenu();
})();
</script>
</body>
</html>
